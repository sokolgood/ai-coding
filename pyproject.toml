[tool.poetry]
name = "ai-coding"
version = "0.1.0"
description = ""
authors = ["itsfedorsokolov@gmail.com"]
readme = "README.md"
package-mode = false

[tool.poetry.scripts]
agent = "src.cli:main"

[tool.poetry.dependencies]
python = ">=3.11.9,<=3.11.13"
pydantic-settings = "^2.6.0"
python-dotenv = "^1.0.1"
jinja2 = "^3.1.5"
openai = "^1.65.4"
pygithub = "^2.1.1"
rich = "^14.2.0"
tiktoken = "^0.12.0"
pyyaml = "^6.0.3"
langfuse = "^2.56.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.4.4"
notebook = "^7.2.0"
pre-commit = "^3.7.1"
pytest = "^8.3.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "migrations"
]
# Include jupyter checks
extend-include = ["*.ipynb"]

line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "ANN",
    "RUF",
    "ASYNC"
]
ignore = ["ANN101", "RUF001", "RUF002", "RUF003", "ANN201", "ANN204", "ANN002", "ANN003"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
